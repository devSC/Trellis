interface:
  display_name: "需求文档撰写"
  short_description: "按“阶段写作+完成收敛”生成含 UI/API/CLI 入口的需求文档"
  default_prompt: "请使用 $requirement-writing 分阶段撰写这份需求文档：先读取同级 requirement-doc-standard 的主定义，按语义SSOT口径执行；第二章按入口组织结构编写，有 UI 时写页面组织，无 UI 时说明页面组织不适用并承接 API-only/CLI-only 入口；阶段0在 1.4 全量场景清单后产出核心能力候选池与正式核心能力清单，并在详细章节后按需校正顶层/派生核心能力；非功能范围豁免按标准包 5.3 写明子项、范围、原因与风险口径；普通轮次正文优先，只有高风险未决项才暂停询问，完成收敛时再输出重复事实清理结果、编号差集检查结果、入口分支追踪结果、真实 UC-接口映射豁免清单、非功能范围豁免清单与剩余风险。"
